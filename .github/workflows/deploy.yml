name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Run tests
        run: ./mvnw test

      - name: Validate CloudFormation template
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - run: aws cloudformation validate-template --template-body file://infrastructure/template.yml

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "$EC2_SSH_KEY" > key.pem
          chmod 400 key.pem

          scp -o StrictHostKeyChecking=no -i key.pem target/fondos-0.0.1-SNAPSHOT.jar ec2-user@$EC2_HOST:~/fondos-0.0.1-SNAPSHOT.jar

          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@$EC2_HOST << EOF
            pkill -f 'java -jar' || true
            sleep 2
            nohup java -jar fondos-0.0.1-SNAPSHOT.jar \
              --spring.data.mongodb.uri="$MONGODB_URI" \
              --jwt.secret="$JWT_SECRET" > app.log 2>&1 &
          EOF

          rm -f key.pem
